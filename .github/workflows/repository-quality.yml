name: Repository quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata validator
        run: python -m pip install PyYAML==6.0.3

      - name: Verify SHA-256 manifest
        run: python verify_manifest.py --check

      - name: Compile public Python scripts
        run: python -m compileall -q replication verification

      - name: Validate JSON metadata
        run: |
          python -m json.tool codemeta.json >/dev/null
          python -m json.tool public_manifest.json >/dev/null
          python -m json.tool figures/figure_stats.json >/dev/null
          python -m json.tool replication/manifest_k.json >/dev/null

      - name: Validate citation metadata
        run: python -c "import yaml; yaml.safe_load(open('CITATION.cff', encoding='utf-8'))"

      - name: Check required public files
        run: |
          test -s README.md
          test -s REPRODUCIBILITY.md
          test -s CITATION.cff
          test -s codemeta.json
          test -s paper/paper.pdf
          test -s paper/supplement.pdf
          test -s paper/revision_notes.pdf
          test -s replication/CHANGELOG_v2.md

      - name: Reject tracked caches, secrets and private paths
        run: |
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
          test -z "$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$' || true)"
          test -z "$(git grep -l -E '/Users/[a-z]+/|/private/tmp' -- ':!*.pdf' ':!.github/workflows/*' || true)"

      - name: Reconstruction model reproduces its shipped output
        run: |
          python -m pip install "numpy>=2.4"
          cd replication
          cp results_model/toy_results_v2.md /tmp/shipped.md
          python model_v2.py >/dev/null
          cmp results_model/toy_results_v2.md /tmp/shipped.md
